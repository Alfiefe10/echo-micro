name: Build

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # SHA-256 del certificado de firma de las releases (publico, no es secreto).
  # Sacado de echo-micro-3.1.0.apk (igual en v2.2.0 y v3.0.0).
  RELEASE_CERT_SHA256: 6d0918ae3024ab373dce2d0a018470a6c5e976130582195889c050c366e97f0c

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-studio-project
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: RNNoise sources
        working-directory: .
        run: python3 scripts/fetch_rnnoise.py

      - name: DSP tests
        working-directory: .
        run: |
          C=android-studio-project/Echo/src/main/cpp
          S=$C/rnnoise/src
          gcc -O2 -shared -fPIC -w -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" -I$C/rnnoise/include -I$S \
            $C/rnnoise_jni.c $S/denoise.c $S/rnn.c $S/pitch.c $S/kiss_fft.c $S/celt_lpc.c $S/nnet.c \
            $S/nnet_default.c $S/parse_lpcnet_weights.c $S/rnnoise_data.c $S/rnnoise_tables.c -lm \
            -o "$RUNNER_TEMP/libechornnoise.so"
          javac -d "$RUNNER_TEMP/dsp" android-studio-project/Echo/src/main/java/com/github/warren_bank/echo/dsp/*.java dsp-tests/*.java
          java -ea -Djava.library.path="$RUNNER_TEMP" -cp "$RUNNER_TEMP/dsp" DspTests | tee "$RUNNER_TEMP/dsp.log"
          ! grep -q "^--" "$RUNNER_TEMP/dsp.log"
          java -ea -cp "$RUNNER_TEMP/dsp" ProbeTests

      - name: Version
        id: version
        working-directory: .
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.0.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::Falta el secreto KEYSTORE_B64: una release no puede salir sin firmar."
            exit 1
          else
            echo "::notice::Sin KEYSTORE_B64: la APK de este run sale sin firmar."
          fi

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          bash gradlew --no-daemon assembleWithAllLanguageTranslationsRelease \
            -PversionName='${{ steps.version.outputs.name }}' \
            -PversionCode='${{ github.run_number }}'
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp Echo/build/outputs/apk/withAllLanguageTranslations/release/*.apk \
            "$GITHUB_WORKSPACE/out/echo-micro-${{ steps.version.outputs.name }}.apk"
          ls -l "$GITHUB_WORKSPACE/out"

      - name: Verify signature
        if: env.KEYSTORE_FILE != ''
        working-directory: .
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          APK=$(ls out/*.apk)
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/verify.log"
          GOT=$(grep -m1 'Signer #1 certificate SHA-256 digest:' "$RUNNER_TEMP/verify.log" | awk '{print $NF}')
          if [ "$GOT" != "$RELEASE_CERT_SHA256" ]; then
            echo "::error::Certificado inesperado: ${GOT:-ninguno} (esperado $RELEASE_CERT_SHA256)"
            exit 1
          fi
          echo "Firma correcta: $GOT"

      - uses: actions/upload-artifact@v7
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: echo-micro-${{ steps.version.outputs.name }}
          path: out/*.apk
          retention-days: 14

      # Solo para pasar la APK al job de publicacion; la descarga publica es la release.
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: release-apk
          path: out/*.apk
          retention-days: 1

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-apk
          path: out

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "La release $GITHUB_REF_NAME ya existe: se sustituye la APK."
            gh release upload "$GITHUB_REF_NAME" out/*.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" out/*.apk --title "Echo Micro $GITHUB_REF_NAME" --generate-notes
          fi
