project.ext {
  applicationId      = 'io.github.alfiefe10.echo'
  javaNamespace      = 'com.github.warren_bank.echo'
  // CI passes -PversionName=X.Y.Z (from the tag) and -PversionCode=<run number>
  releaseVersionCode = Integer.parseInt(project.findProperty('versionCode') ?: '1', 10)
  releaseVersion     = project.findProperty('versionName') ?: '0.0.0-local'
  javaVersion        = JavaVersion.VERSION_1_8
  minSdkVersion      = 26
  targetSdkVersion   = 35
  compileSdkVersion  = 35
  buildToolsVersion  = '35.0.0'
}
